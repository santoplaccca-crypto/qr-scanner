<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>App Sconti Universitari</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #111; color: white; margin: 0; padding: 20px; text-align: center; }
    .card { background: #222; padding: 20px; border-radius: 12px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 6px; border: none; font-size: 16px; box-sizing: border-box; }
    button { width: 100%; padding: 14px; background: #4CAF50; color: white; font-size: 16px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    #panel-scanner { display: none; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; background: black; margin-top: 20px; }
    #risultato { margin-top: 20px; padding: 15px; border-radius: 8px; font-size: 18px; font-weight: bold; display: none; }
    .successo { background: #166534; color: white; border: 2px solid #22c55e; }
    .errore { background: #991b1b; color: white; border: 2px solid #ef4444; }
  </style>
</head>
<body>

  <!-- PANNELLO LOGIN -->
  <div id="panel-login" class="card">
    <h2>Accesso Tesserati</h2>
    <input type="text" id="cf" placeholder="Codice Fiscale">
    <input type="text" id="mat" placeholder="Matricola">
    <button onclick="faiLogin()">Accedi</button>
    <div id="msg-login" style="color: #ffaa00; margin-top: 15px;"></div>
  </div>

  <!-- PANNELLO SCANNER -->
  <div id="panel-scanner" class="card">
    <h2>Scanner Sconti</h2>
    <div id="dati-utente" style="color: #aaa; font-size: 14px; margin-bottom: 10px;"></div>
    <div id="reader"></div>
    <div id="risultato"></div>
    <button onclick="avviaScanner()" style="background: #3b82f6; display: none;" id="btn-riavvia">Scansiona un altro QR</button>
  </div>

  <script>
    // INSERISCI QUI L'URL FORNITO DA GOOGLE APPS SCRIPT
    const API_URL = "https://script.google.com/macros/s/AKfycbwQhuwLs3slZGroHHZtiFJrVL3SPUVtZH0nnOZIlg6nF78VhvWv3vpPnA__GLBMGHGt/exec";
    
    let html5QrcodeScanner;

    // --- FUNZIONE 1: LOGIN ---
    async function faiLogin() {
      const cf = document.getElementById('cf').value;
      const mat = document.getElementById('mat').value;
      const msgBox = document.getElementById('msg-login');
      
      if(!cf || !mat) { msgBox.innerText = "Compila tutti i campi."; return; }
      msgBox.innerText = "Connessione al server...";

      // Struttura dati per evitare errori CORS
      const formData = new URLSearchParams();
      formData.append('azione', 'login');
      formData.append('cf', cf);
      formData.append('mat', mat);

      try {
        const response = await fetch(API_URL, { method: 'POST', body: formData });
        const dati = await response.json();

        if (dati.successo) {
          localStorage.setItem('userAssociazione', dati.associazione);
          
          document.getElementById('panel-login').style.display = 'none';
          document.getElementById('panel-scanner').style.display = 'block';
          document.getElementById('dati-utente').innerText = "Tesserato: " + dati.nome + " (" + dati.associazione + ")";
          
          avviaScanner();
        } else {
          msgBox.innerText = dati.messaggio;
        }
      } catch (error) {
        msgBox.innerText = "Errore di connessione a Google.";
      }
    }

    // --- FUNZIONE 2: AVVIO FOTOCAMERA ---
    function avviaScanner() {
      document.getElementById('risultato').style.display = 'none';
      document.getElementById('btn-riavvia').style.display = 'none';

      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
      html5QrcodeScanner.render(onScanSuccess, function(){});
    }

    // --- FUNZIONE 3: INVIO QR CODE AL SERVER ---
    async function onScanSuccess(codiceLetto) {
      html5QrcodeScanner.clear(); 
      
      const divRisultato = document.getElementById('risultato');
      divRisultato.style.display = 'block';
      divRisultato.className = "";
      divRisultato.innerText = "Verifica convenzione...";

      const associazione = localStorage.getItem('userAssociazione');

      const formData = new URLSearchParams();
      formData.append('azione', 'scan');
      formData.append('qrCode', codiceLetto);
      formData.append('associazione', associazione);

      try {
        const response = await fetch(API_URL, { method: 'POST', body: formData });
        const dati = await response.json();

        if (dati.successo) {
          divRisultato.className = "successo";
          divRisultato.innerHTML = "✅ SCONTO VALIDO<br><br>" + dati.messaggio;
        } else {
          divRisultato.className = "errore";
          divRisultato.innerHTML = "❌ SCONTO NEGATO<br><br>" + dati.messaggio;
        }
        document.getElementById('btn-riavvia').style.display = 'block';
      } catch (error) {
        divRisultato.className = "errore";
        divRisultato.innerHTML = "Errore di comunicazione col database.";
        document.getElementById('btn-riavvia').style.display = 'block';
      }
    }
  </script>
</body>
</html>
