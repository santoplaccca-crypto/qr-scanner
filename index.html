<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>QR Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: #000;
    }

    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    #canvas {
      display: none;
    }

    #scannerBox {
      position: absolute;
      top: 50%;
      left: 50%;

      width: min(72vw, 320px);
      height: min(72vw, 320px);

      transform: translate(-50%, -50%);

      border: 3px solid white;
      border-radius: 24px;

      box-shadow:
        0 0 0 9999px rgba(0, 0, 0, 0.35);

      pointer-events: none;
    }

    #status {
      position: absolute;

      top: calc(env(safe-area-inset-top) + 20px);
      left: 50%;

      transform: translateX(-50%);

      width: min(92%, 500px);

      padding: 12px 18px;

      border-radius: 20px;

      background: rgba(0, 0, 0, 0.75);

      color: white;

      text-align: center;

      font-size: 15px;

      z-index: 10;
    }

    #startPanel {
      position: absolute;
      inset: 0;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      padding: 30px;

      background: rgba(0, 0, 0, 0.9);

      color: white;

      text-align: center;

      z-index: 20;
    }

    #startPanel h1 {
      margin: 0 0 12px;
    }

    #startPanel p {
      max-width: 400px;
      line-height: 1.5;
      margin: 0 0 24px;
    }

    button {
      border: 0;

      border-radius: 999px;

      padding: 16px 26px;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      background: white;

      color: black;
    }

    #resultPanel {
      display: none;

      position: absolute;

      left: 50%;

      bottom: calc(env(safe-area-inset-bottom) + 25px);

      transform: translateX(-50%);

      width: min(92%, 500px);

      padding: 20px;

      border-radius: 20px;

      color: white;

      text-align: center;

      z-index: 15;
    }

    #resultText {
      margin-bottom: 16px;

      font-size: 18px;

      line-height: 1.4;

      overflow-wrap: anywhere;
    }

    #technical {
      display: none;

      margin-top: 15px;

      font-family: monospace;

      font-size: 11px;

      opacity: 0.8;

      overflow-wrap: anywhere;
    }

    .success {
      background: rgba(22, 101, 52, 0.94) !important;
    }

    .error {
      background: rgba(153, 27, 27, 0.94) !important;
    }
  </style>
</head>

<body>

<div id="app">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <canvas id="canvas"></canvas>

  <div id="scannerBox"></div>

  <div id="status">
    Pronto
  </div>

  <div id="startPanel">

    <h1>Scanner QR</h1>

    <p id="startText">
      Premi il pulsante e inquadra il QR Code.
    </p>

    <button id="startButton">
      Attiva fotocamera
    </button>

    <div id="technical"></div>

  </div>

  <div id="resultPanel">

    <div id="resultText"></div>

    <button id="retryButton">
      Scansiona un altro QR
    </button>

  </div>

</div>


<script>

const GOOGLE_APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbxhGyY0LDlspqBPyPB_kSPZXDCGg5QjLQ83Kv1pAzCgCgJPQsemn2G33KJDhn6XRz8m/exec';


const video =
  document.getElementById('video');

const canvas =
  document.getElementById('canvas');

const context =
  canvas.getContext('2d', {
    willReadFrequently: true
  });

const statusElement =
  document.getElementById('status');

const startPanel =
  document.getElementById('startPanel');

const startText =
  document.getElementById('startText');

const startButton =
  document.getElementById('startButton');

const technical =
  document.getElementById('technical');

const resultPanel =
  document.getElementById('resultPanel');

const resultText =
  document.getElementById('resultText');

const retryButton =
  document.getElementById('retryButton');


let stream = null;

let scanning = false;

let qrFound = false;

let animationFrame = null;

let lastScan = 0;


const SCAN_INTERVAL = 120;

const REQUEST_TIMEOUT = 15000;


startButton.addEventListener(
  'click',
  startScanner
);


retryButton.addEventListener(
  'click',
  startScanner
);


async function startScanner() {

  stopCamera();

  qrFound = false;

  scanning = false;

  resultPanel.style.display = 'none';

  technical.style.display = 'none';

  setStatus(
    'Richiesta accesso alla fotocamera...'
  );


  if (!window.isSecureContext) {

    showCameraError(
      'La pagina deve essere aperta tramite HTTPS.',
      'SecureContext = false'
    );

    return;
  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showCameraError(
      'Questo browser non supporta la fotocamera.',
      'getUserMedia non disponibile'
    );

    return;
  }


  try {

    try {

      stream =
        await navigator.mediaDevices.getUserMedia({

          audio: false,

          video: {

            facingMode: {
              ideal: 'environment'
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          }

        });

    }

    catch (erroreCameraPosteriore) {

      stream =
        await navigator.mediaDevices.getUserMedia({

          audio: false,

          video: true

        });

    }


    video.srcObject = stream;

    await video.play();


    startPanel.style.display =
      'none';


    setStatus(
      'Inquadra un QR Code'
    );


    scanning = true;

    lastScan = 0;


    animationFrame =
      requestAnimationFrame(
        scanFrame
      );

  }

  catch (error) {

    handleCameraError(
      error
    );

  }

}


function scanFrame(timestamp) {

  if (
    !scanning ||
    qrFound
  ) {

    return;

  }


  animationFrame =
    requestAnimationFrame(
      scanFrame
    );


  if (
    timestamp - lastScan <
    SCAN_INTERVAL
  ) {

    return;

  }


  lastScan = timestamp;


  if (
    video.readyState <
    video.HAVE_ENOUGH_DATA
  ) {

    return;

  }


  const videoWidth =
    video.videoWidth;

  const videoHeight =
    video.videoHeight;


  if (
    !videoWidth ||
    !videoHeight
  ) {

    return;

  }


  const maxWidth = 900;


  const scale =
    Math.min(
      1,
      maxWidth / videoWidth
    );


  canvas.width =
    Math.round(
      videoWidth * scale
    );


  canvas.height =
    Math.round(
      videoHeight * scale
    );


  context.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  try {

    const imageData =
      context.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );


    const result =
      jsQR(
        imageData.data,
        imageData.width,
        imageData.height,
        {
          inversionAttempts:
            'attemptBoth'
        }
      );


    if (
      result &&
      result.data
    ) {

      qrFound = true;

      handleQRCode(
        result.data
      );

    }

  }

  catch (error) {

    console.error(
      'Errore QR:',
      error
    );

  }

}


async function handleQRCode(qrValue) {

  stopCamera();


  setStatus(
    'QR letto. Ricerca convenzione...'
  );


  try {

    const risposta =
      await inviaQR(
        qrValue
      );


    if (
      risposta &&
      risposta.valido
    ) {

      mostraRisultato(
        risposta.messaggio,
        true
      );

    }

    else {

      mostraRisultato(

        risposta &&
        risposta.messaggio

          ? risposta.messaggio

          : 'Nessuna convenzione trovata.',

        false

      );

    }

  }

  catch (error) {

    console.error(
      error
    );


    mostraRisultato(
      'Errore di collegamento al motore di ricerca.',
      false
    );

  }

}


/*
 * QUI LO SCANNER INVIA SOLO IL QR.
 *
 * Nessuna Alfa.
 * Nessuna Beta.
 * Nessuna ricerca nel frontend.
 */

function inviaQR(qrCode) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =

        '__qrCallback_' +

        Date.now() +

        '_' +

        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          'script'
        );


      let timeoutId = null;

      let completed = false;


      function cleanup() {

        if (timeoutId) {

          clearTimeout(
            timeoutId
          );

        }


        if (script.parentNode) {

          script.parentNode
            .removeChild(
              script
            );

        }


        try {

          delete window[
            callbackName
          ];

        }

        catch (_) {

          window[
            callbackName
          ] = undefined;

        }

      }


      function finish(
        fn,
        value
      ) {

        if (completed) {

          return;

        }


        completed = true;

        cleanup();

        fn(value);

      }


      window[
        callbackName
      ] =
        function(response) {

          finish(
            resolve,
            response
          );

        };


      script.onerror =
        function() {

          finish(

            reject,

            new Error(
              'Errore Apps Script'
            )

          );

        };


      const params =
        new URLSearchParams({

          qrCode:
            qrCode,

          callback:
            callbackName

        });


      script.src =

        GOOGLE_APPS_SCRIPT_URL +

        '?' +

        params.toString();


      document.body
        .appendChild(
          script
        );


      timeoutId =
        setTimeout(

          function() {

            finish(

              reject,

              new Error(
                'Timeout Apps Script'
              )

            );

          },

          REQUEST_TIMEOUT

        );

    }
  );

}


function mostraRisultato(
  message,
  success
) {

  resultText.textContent =
    message;


  resultPanel.classList.remove(
    'success',
    'error'
  );


  resultPanel.classList.add(

    success

      ? 'success'

      : 'error'

  );


  resultPanel.style.display =
    'block';


  setStatus(

    success

      ? 'Convenzione trovata'

      : 'Convenzione non trovata',

    success

      ? 'success'

      : 'error'

  );

}


function handleCameraError(error) {

  const name =
    error &&
    error.name

      ? error.name

      : 'Errore sconosciuto';


  const message =
    error &&
    error.message

      ? error.message

      : '';


  if (
    name === 'NotAllowedError' ||
    name === 'PermissionDeniedError'
  ) {

    showCameraError(

      'Permesso fotocamera negato. Consenti la fotocamera nel browser.',

      name +
      ' - ' +
      message

    );

    return;

  }


  if (
    name === 'NotFoundError'
  ) {

    showCameraError(
      'Nessuna fotocamera trovata.',
      name
    );

    return;

  }


  showCameraError(

    'Impossibile utilizzare la fotocamera.',

    name +
    ' - ' +
    message

  );

}


function showCameraError(
  message,
  detail
) {

  stopCamera();


  startPanel.style.display =
    'flex';


  startText.textContent =
    message;


  technical.textContent =
    'Dettaglio: ' +
    detail;


  technical.style.display =
    'block';


  setStatus(
    'Fotocamera non disponibile',
    'error'
  );

}


function stopCamera() {

  scanning = false;


  if (animationFrame) {

    cancelAnimationFrame(
      animationFrame
    );

    animationFrame = null;

  }


  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

    stream = null;

  }


  video.srcObject =
    null;

}


function setStatus(
  text,
  type = ''
) {

  statusElement.textContent =
    text;


  statusElement.classList.remove(
    'success',
    'error'
  );


  if (type) {

    statusElement
      .classList
      .add(
        type
      );

  }

}


window.addEventListener(
  'pagehide',
  stopCamera
);


window.addEventListener(
  'beforeunload',
  stopCamera
);

</script>

</body>
</html>
