<!DOCTYPE html>
<html lang="it">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>QR Scanner Convenzioni</title>

  <!-- Libreria lettura QR -->
  <script
    src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #000;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      overflow: hidden;

    }


    #app {

      position: relative;

      width: 100%;

      height: 100vh;
      height: 100dvh;

      background: #000;

    }


    #video {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      background: #000;

    }


    #canvas {

      display: none;

    }


    #scannerBox {

      position: absolute;

      top: 50%;
      left: 50%;

      width: min(72vw, 320px);
      height: min(72vw, 320px);

      transform:
        translate(-50%, -50%);

      border:
        3px solid white;

      border-radius:
        24px;

      box-shadow:
        0 0 0 9999px
        rgba(0,0,0,.35);

      pointer-events: none;

      z-index: 3;

    }


    #status {

      position: absolute;

      top:
        calc(
          env(safe-area-inset-top)
          + 18px
        );

      left: 50%;

      transform:
        translateX(-50%);

      width:
        min(92%, 520px);

      padding:
        12px 16px;

      border-radius:
        18px;

      background:
        rgba(0,0,0,.75);

      color: white;

      text-align: center;

      font-size: 15px;

      line-height: 1.35;

      z-index: 10;

    }


    #startPanel {

      position: absolute;

      inset: 0;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      padding: 30px;

      background:
        rgba(0,0,0,.90);

      color: white;

      text-align: center;

      z-index: 20;

    }


    #startPanel h1 {

      margin:
        0 0 12px;

      font-size:
        28px;

    }


    #startPanel p {

      max-width: 420px;

      margin:
        0 0 24px;

      line-height:
        1.5;

      color:
        #ddd;

    }


    button {

      border: 0;

      border-radius:
        999px;

      padding:
        16px 26px;

      font-size:
        17px;

      font-weight:
        bold;

      cursor: pointer;

      background:
        white;

      color:
        black;

    }


    button:disabled {

      opacity: .55;

    }


    #resultPanel {

      display: none;

      position: absolute;

      left: 50%;

      bottom:
        calc(
          env(safe-area-inset-bottom)
          + 25px
        );

      transform:
        translateX(-50%);

      width:
        min(92%, 520px);

      padding:
        20px;

      border-radius:
        20px;

      background:
        rgba(0,0,0,.90);

      color:
        white;

      text-align:
        center;

      z-index:
        15;

    }


    #resultText {

      margin-bottom:
        16px;

      font-size:
        18px;

      line-height:
        1.45;

      overflow-wrap:
        anywhere;

    }


    #technical {

      display: none;

      margin-top:
        15px;

      max-width:
        420px;

      font-family:
        monospace;

      font-size:
        11px;

      color:
        #ccc;

      overflow-wrap:
        anywhere;

    }


    .success {

      background:
        rgba(22,101,52,.94)
        !important;

    }


    .error {

      background:
        rgba(153,27,27,.94)
        !important;

    }

  </style>

</head>


<body>


<div id="app">


  <!-- VIDEO FOTOCAMERA -->

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>


  <!-- FRAME NASCOSTO UTILIZZATO DA jsQR -->

  <canvas id="canvas"></canvas>


  <!-- AREA VISIVA SCANNER -->

  <div id="scannerBox"></div>


  <!-- STATO -->

  <div id="status">

    Pronto

  </div>


  <!-- SCHERMATA INIZIALE -->

  <div id="startPanel">


    <h1>

      Scanner QR

    </h1>


    <p id="startDescription">

      Attiva la fotocamera e inquadra
      il QR Code.

      La ricerca nei database viene
      eseguita automaticamente.

    </p>


    <button
      id="startButton"
      type="button">

      Attiva fotocamera

    </button>


    <div id="technical"></div>


  </div>


  <!-- RISULTATO -->

  <div id="resultPanel">


    <div id="resultText">

    </div>


    <button
      id="retryButton"
      type="button">

      Scansiona un altro QR

    </button>


  </div>


</div>



<script>


/************************************************
 *
 * URL GOOGLE APPS SCRIPT
 *
 ************************************************/


const GOOGLE_APPS_SCRIPT_URL =

  'https://script.google.com/macros/s/AKfycbxhGyY0LDlspqBPyPB_kSPZXDCGg5QjLQ83Kv1pAzCgCgJPQsemn2G33KJDhn6XRz8m/exec';



/************************************************
 *
 * ELEMENTI HTML
 *
 ************************************************/


const video =
  document.getElementById(
    'video'
  );


const canvas =
  document.getElementById(
    'canvas'
  );


const context =
  canvas.getContext(
    '2d',
    {
      willReadFrequently: true
    }
  );


const statusElement =
  document.getElementById(
    'status'
  );


const startPanel =
  document.getElementById(
    'startPanel'
  );


const startButton =
  document.getElementById(
    'startButton'
  );


const startDescription =
  document.getElementById(
    'startDescription'
  );


const technical =
  document.getElementById(
    'technical'
  );


const resultPanel =
  document.getElementById(
    'resultPanel'
  );


const resultText =
  document.getElementById(
    'resultText'
  );


const retryButton =
  document.getElementById(
    'retryButton'
  );



/************************************************
 *
 * STATO APP
 *
 ************************************************/


let stream = null;

let scanning = false;

let qrFound = false;

let animationFrame = null;

let lastScan = 0;


const SCAN_INTERVAL =
  120;


const REQUEST_TIMEOUT =
  15000;



/************************************************
 *
 * PULSANTI
 *
 ************************************************/


startButton.addEventListener(
  'click',
  startScanner
);


retryButton.addEventListener(
  'click',
  startScanner
);



/************************************************
 *
 * AVVIO FOTOCAMERA
 *
 ************************************************/


async function startScanner() {


  stopCamera();


  qrFound =
    false;


  scanning =
    false;


  resultPanel.style.display =
    'none';


  technical.style.display =
    'none';


  startButton.disabled =
    true;


  setStatus(
    'Richiesta accesso alla fotocamera...'
  );


  /*
   * La fotocamera richiede HTTPS.
   */

  if (
    !window.isSecureContext
  ) {


    cameraError(
      'La pagina deve essere aperta tramite HTTPS.',
      'SecureContext = false'
    );


    return;

  }



  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {


    cameraError(
      'Questo browser non supporta la fotocamera.',
      'getUserMedia non disponibile'
    );


    return;

  }



  try {


    /*
     * Primo tentativo:
     * fotocamera posteriore.
     */


    try {


      stream =
        await navigator.mediaDevices
          .getUserMedia({

            audio: false,

            video: {

              facingMode: {
                ideal: 'environment'
              },

              width: {
                ideal: 1280
              },

              height: {
                ideal: 720
              }

            }

          });


    }


    catch (erroreCameraPosteriore) {


      /*
       * Fallback:
       * qualsiasi fotocamera.
       */


      stream =
        await navigator.mediaDevices
          .getUserMedia({

            audio: false,

            video: true

          });


    }



    video.srcObject =
      stream;


    await video.play();


    startPanel.style.display =
      'none';


    setStatus(
      'Inquadra un QR Code'
    );


    scanning =
      true;


    lastScan =
      0;


    animationFrame =
      requestAnimationFrame(
        scanFrame
      );


  }


  catch (error) {


    handleCameraError(
      error
    );


  }


  finally {


    startButton.disabled =
      false;


  }


}



/************************************************
 *
 * ERRORI FOTOCAMERA
 *
 ************************************************/


function handleCameraError(
  error
) {


  const errorName =
    error &&
    error.name

      ? error.name

      : 'Errore sconosciuto';



  const errorMessage =
    error &&
    error.message

      ? error.message

      : '';



  if (
    errorName ===
      'NotAllowedError' ||

    errorName ===
      'PermissionDeniedError'
  ) {


    cameraError(

      'Accesso alla fotocamera negato. Consenti la fotocamera nelle autorizzazioni del sito.',

      errorName +
      ' - ' +
      errorMessage

    );


    return;

  }



  if (
    errorName ===
      'NotFoundError' ||

    errorName ===
      'DevicesNotFoundError'
  ) {


    cameraError(

      'Nessuna fotocamera trovata.',

      errorName

    );


    return;

  }



  if (
    errorName ===
      'NotReadableError'
  ) {


    cameraError(

      'La fotocamera potrebbe essere utilizzata da un’altra applicazione.',

      errorName +
      ' - ' +
      errorMessage

    );


    return;

  }



  cameraError(

    'Impossibile utilizzare la fotocamera.',

    errorName +
    ' - ' +
    errorMessage

  );


}



function cameraError(
  message,
  detail
) {


  stopCamera();


  startPanel.style.display =
    'flex';


  startDescription.textContent =
    message;


  technical.textContent =
    'Dettaglio: ' +
    detail;


  technical.style.display =
    'block';


  setStatus(
    'Fotocamera non disponibile',
    'error'
  );


}



/************************************************
 *
 * LETTURA CONTINUA QR
 *
 ************************************************/


function scanFrame(
  timestamp
) {


  if (
    !scanning ||
    qrFound
  ) {

    return;

  }



  animationFrame =
    requestAnimationFrame(
      scanFrame
    );



  /*
   * Limita il consumo CPU.
   */


  if (
    timestamp - lastScan
    <
    SCAN_INTERVAL
  ) {

    return;

  }


  lastScan =
    timestamp;



  if (
    video.readyState
    <
    video.HAVE_ENOUGH_DATA
  ) {

    return;

  }



  const videoWidth =
    video.videoWidth;


  const videoHeight =
    video.videoHeight;



  if (
    !videoWidth ||
    !videoHeight
  ) {

    return;

  }



  /*
   * Riduciamo la risoluzione
   * utilizzata per la scansione.
   */


  const maxWidth =
    900;


  const scale =
    Math.min(
      1,
      maxWidth /
      videoWidth
    );


  canvas.width =
    Math.max(
      1,
      Math.round(
        videoWidth *
        scale
      )
    );


  canvas.height =
    Math.max(
      1,
      Math.round(
        videoHeight *
        scale
      )
    );



  context.drawImage(

    video,

    0,
    0,

    canvas.width,
    canvas.height

  );



  try {


    const imageData =
      context.getImageData(

        0,
        0,

        canvas.width,
        canvas.height

      );



    const result =
      jsQR(

        imageData.data,

        imageData.width,

        imageData.height,

        {

          inversionAttempts:
            'attemptBoth'

        }

      );



    if (
      result &&
      result.data
    ) {


      qrFound =
        true;


      handleQRCode(
        result.data
      );


    }


  }


  catch (error) {


    console.error(
      'Errore lettura QR:',
      error
    );


  }


}



/************************************************
 *
 * QR TROVATO
 *
 ************************************************/


async function handleQRCode(
  qrValue
) {


  scanning =
    false;


  stopCamera();



  console.log(
    'QR letto:',
    qrValue
  );



  setStatus(
    'QR letto. Ricerca convenzione...'
  );



  try {


    const risposta =
      await cercaConvenzione(
        qrValue
      );



    if (
      risposta &&
      risposta.valido
    ) {


      mostraRisultato(

        risposta.messaggio,

        true

      );


    }


    else {


      mostraRisultato(

        risposta &&
        risposta.messaggio

          ? risposta.messaggio

          : 'Nessuna convenzione trovata.',

        false

      );


    }


  }


  catch (error) {


    console.error(
      'Errore ricerca:',
      error
    );


    mostraRisultato(

      'Errore di collegamento al motore di ricerca.',

      false

    );


  }


}



/************************************************
 *
 * CHIAMATA A GOOGLE APPS SCRIPT
 *
 ************************************************/


function cercaConvenzione(
  qrCode
) {


  /*
   * Usiamo JSONP perché GitHub Pages
   * e Apps Script sono su domini diversi.
   *
   * Lo scanner invia SOLO:
   *
   * qrCode
   */


  return new Promise(

    function(
      resolve,
      reject
    ) {


      const callbackName =

        '__qrCallback_' +

        Date.now() +

        '_' +

        Math.floor(
          Math.random() *
          100000
        );



      const script =
        document.createElement(
          'script'
        );


      let timeoutId =
        null;


      let completed =
        false;



      function cleanup() {


        if (
          timeoutId
        ) {

          clearTimeout(
            timeoutId
          );

        }


        if (
          script.parentNode
        ) {


          script.parentNode
            .removeChild(
              script
            );


        }


        try {


          delete window[
            callbackName
          ];


        }


        catch (_) {


          window[
            callbackName
          ] =
            undefined;


        }


      }



      function finish(
        fn,
        value
      ) {


        if (
          completed
        ) {

          return;

        }


        completed =
          true;


        cleanup();


        fn(
          value
        );


      }



      window[
        callbackName
      ] =
        function(response) {


          finish(
            resolve,
            response
          );


        };



      script.onerror =
        function() {


          finish(

            reject,

            new Error(
              'Errore endpoint Apps Script'
            )

          );


        };



      const params =
        new URLSearchParams({

          qrCode:
            qrCode,

          callback:
            callbackName

        });



      script.src =

        GOOGLE_APPS_SCRIPT_URL +

        '?' +

        params.toString();



      document.body
        .appendChild(
          script
        );



      timeoutId =
        setTimeout(

          function() {


            finish(

              reject,

              new Error(
                'Timeout Apps Script'
              )

            );


          },

          REQUEST_TIMEOUT

        );


    }

  );


}



/************************************************
 *
 * RISULTATO
 *
 ************************************************/


function mostraRisultato(
  message,
  success
) {


  resultText.textContent =
    message;


  resultPanel.classList.remove(
    'success',
    'error'
  );


  resultPanel.classList.add(

    success

      ? 'success'

      : 'error'

  );


  resultPanel.style.display =
    'block';



  setStatus(

    success

      ? 'Convenzione trovata'

      : 'Convenzione non trovata',

    success

      ? 'success'

      : 'error'

  );


}



/************************************************
 *
 * CHIUSURA FOTOCAMERA
 *
 ************************************************/


function stopCamera() {


  scanning =
    false;


  if (
    animationFrame
  ) {


    cancelAnimationFrame(
      animationFrame
    );


    animationFrame =
      null;


  }



  if (
    stream
  ) {


    stream
      .getTracks()
      .forEach(

        function(track) {

          track.stop();

        }

      );


    stream =
      null;


  }



  video.srcObject =
    null;


}



function setStatus(
  text,
  type = ''
) {


  statusElement.textContent =
    text;


  statusElement.classList.remove(
    'success',
    'error'
  );


  if (
    type
  ) {


    statusElement
      .classList
      .add(
        type
      );


  }


}



window.addEventListener(
  'pagehide',
  stopCamera
);


window.addEventListener(
  'beforeunload',
  stopCamera
);


</script>


</body>

</html>
